server:
  servlet:
    session:
      cookie:
        secure: true
        same-site: strict
        http-only: true

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER:${DB_USERNAME}}
    password: ${DB_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

civicfix:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN}
  seed-demo: false
  security:
    allow-seed-accounts: ${ALLOW_SEED_ACCOUNTS:false}
    trusted-proxy-enabled: ${TRUSTED_PROXY_ENABLED:true}

logging:
  level:
    com.civicfix: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO

