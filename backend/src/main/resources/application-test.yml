spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:civicfix_db}
    username: ${DB_USERNAME:civicfix_user}
    password: ${DB_PASSWORD:civicfix_dev_password_only}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 0

logging:
  level:
    com.civicfix: DEBUG

civicfix:
  async:
    mode: sync
  ai:
    vision:
      enabled: false
  security:
    trusted-proxy-enabled: false
  sla:
    escalation-job:
      enabled: false
  auto-confirm:
    enabled: false
  reopen:
    window-days: 30
  evidence:
    max-distance-meters: 100.0
    max-accuracy-meters: 100.0
  rate-limit:
    login:
      capacity: 10000
      duration: 15m
    account-login:
      capacity: 10000
      duration: 1h
    register:
      capacity: 10000
      duration: 1h
    complaint-create:
      capacity: 10000
      duration: 1m
    upload:
      capacity: 10000
      duration: 1m
    reverse-geocode:
      capacity: 10000
      duration: 1m
