server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: CIVICFIX_SESSION
        http-only: true
        secure: false # set to true in production with HTTPS
        same-site: lax
        max-age: 3600s
      timeout: 60m

spring:
  application:
    name: civicfix-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 25MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:civicfix_db}
    username: ${DB_USER:${DB_USERNAME:civicfix_user}}
    password: ${DB_PASSWORD:civicfix_dev_password_only}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Schema managed exclusively via Flyway
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Actuator configuration: restrict sensitive health/metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized

# App Custom Properties
civicfix:
  seed-demo: ${CIVICFIX_SEED_DEMO:false}
  security:
    allow-seed-accounts: ${ALLOW_SEED_ACCOUNTS:true}
    trusted-proxy-enabled: ${TRUSTED_PROXY_ENABLED:false}
  sla:
    escalation-job:
      enabled: ${SLA_ESCALATION_ENABLED:true}
      interval-ms: ${SLA_ESCALATION_INTERVAL:300000}
      batch-size: ${SLA_ESCALATION_BATCH_SIZE:50}
  auto-confirm:
    enabled: ${AUTO_CONFIRM_ENABLED:true}
    days: ${AUTO_CONFIRM_DAYS:7}
    interval-ms: ${AUTO_CONFIRM_INTERVAL:300000}
    batch-size: ${AUTO_CONFIRM_BATCH_SIZE:50}
  reopen:
    window-days: ${REOPEN_WINDOW_DAYS:30}
  evidence:
    max-distance-meters: ${EVIDENCE_MAX_DISTANCE:100.0}
    max-accuracy-meters: ${EVIDENCE_MAX_ACCURACY:100.0}
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
  storage:
    provider: ${STORAGE_PROVIDER:local} # Safe local filesystem storage abstraction. S3/Blob storage can be configured when cloud credentials are provided.
    upload-dir: ${STORAGE_UPLOAD_DIR:uploads/evidence}
    max-file-size-mb: 10
  ai:
    vision:
      enabled: ${AI_VISION_ENABLED:false}
      provider: ${AI_VISION_PROVIDER:gemini}
      google-api-key: ${GOOGLE_AI_API_KEY:}
      xai-api-key: ${XAI_API_KEY:}
      gemini-model: ${AI_VISION_MODEL_GEMINI:gemini-1.5-flash}
      xai-model: ${AI_VISION_MODEL_XAI:grok-2-vision-1212}
      timeout-ms: ${AI_VISION_TIMEOUT_MS:10000}
      daily-cap: ${AI_VISION_DAILY_CAP:200}
      gemini-base-url: ${AI_VISION_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      xai-base-url: ${AI_VISION_XAI_BASE_URL:https://api.x.ai}
  rate-limit:
    login:
      capacity: ${RATE_LIMIT_LOGIN_CAPACITY:5}
      duration: ${RATE_LIMIT_LOGIN_DURATION:15m}
    account-login:
      capacity: ${RATE_LIMIT_ACCOUNT_LOGIN_CAPACITY:20}
      duration: ${RATE_LIMIT_ACCOUNT_LOGIN_DURATION:1h}
    register:
      capacity: ${RATE_LIMIT_REGISTER_CAPACITY:5}
      duration: ${RATE_LIMIT_REGISTER_DURATION:1h}
    complaint-create:
      capacity: ${RATE_LIMIT_COMPLAINT_CAPACITY:10}
      duration: ${RATE_LIMIT_COMPLAINT_DURATION:1m}
    upload:
      capacity: ${RATE_LIMIT_UPLOAD_CAPACITY:10}
      duration: ${RATE_LIMIT_UPLOAD_DURATION:1m}
    reverse-geocode:
      capacity: ${RATE_LIMIT_GEOCODE_CAPACITY:30}
      duration: ${RATE_LIMIT_GEOCODE_DURATION:1m}
