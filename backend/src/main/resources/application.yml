server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: CIVICFIX_SESSION
        http-only: true
        secure: false # set to true in production with HTTPS
        same-site: lax
        max-age: 3600s
      timeout: 60m

spring:
  application:
    name: civicfix-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:civicfix_db}
    username: ${DB_USERNAME:civicfix_user}
    password: ${DB_PASSWORD:civicfix_dev_password_only}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Schema managed exclusively via Flyway
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Actuator configuration: restrict sensitive health/metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized

# App Custom Properties
civicfix:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
