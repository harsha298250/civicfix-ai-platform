services:
  postgres:
    image: postgres:16.4-alpine
    container_name: civicfix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicfix_db}
      POSTGRES_USER: ${POSTGRES_USER:-civicfix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicfix_dev_password_only}
    ports:
      # Host port defaults to 5433 because host port 5432 is occupied by an existing local PostgreSQL service.
      # Binds exclusively to 127.0.0.1 to avoid exposing the database publicly.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civicfix_user} -d ${POSTGRES_DB:-civicfix_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: civicfix_postgres_data
